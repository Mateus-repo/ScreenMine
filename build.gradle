plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // MCEF Modern — the SDL3-era fork that supports Minecraft 26.x
    maven {
        name = 'DimasKama'
        url = uri('https://maven.dimaskama.net/releases')
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile-only: the player installs mcef-modern separately. It already
    // nests jcef-api + the JCEF native launcher, so neither is shipped here.
    compileOnly "net.dimaskama:mcef-modern:${project.mcef_modern_version}"
    compileOnly "me.friwi:jcef-api:${project.jcef_api_version}"
    runtimeOnly "net.dimaskama:mcef-modern:${project.mcef_modern_version}"
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated true
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'mcef_modern_version', project.mcef_modern_version

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version,
                mcef_modern_version: project.mcef_modern_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}